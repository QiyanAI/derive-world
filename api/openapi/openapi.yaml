openapi: 3.1.0
info:
  title: Derive World API
  version: 0.1.0
  description: |
    Derive World OSS MVP API. Implements Digital Self sessions; collaborative
    and interactive Living Objects with controlled mutation, authorization,
    versioned events, derivation, privacy-clipped lineage, audit, and
    idempotency; invitations and Derive Links; Handoff; Personal AI
    conversations, proposals, and human confirmations; personal access tokens
    and self-only export; the Capability Broker with the five frozen
    capabilities; the OpenAPI contract and TypeScript SDK; and the API surface
    used by the v0.1.0 Reference World web client. Real AI access is implemented.
    The approved two-call real-AI acceptance run verified a DeepSeek
    `deepseek-flash` dual Personal AI relay (A and B) within its exact owner-
    authorized scope; it does not claim acceptance of every model, Provider, or
    production environment. Fixture mode is deterministic and is never a real
    model call.
  license:
    name: Apache-2.0
servers:
  - url: http://127.0.0.1:8080
    description: Local development default
security:
  - cookieAuth: []
paths:
  /healthz:
    get:
      operationId: getHealthz
      summary: Liveness probe
      security: []
      responses:
        "200":
          description: The process is alive.
          content:
            text/plain:
              schema:
                type: string
                example: "ok\n"
  /readyz:
    get:
      operationId: getReadyz
      summary: Readiness probe
      description: Returns 200 only when the database is reachable.
      security: []
      responses:
        "200":
          description: The service is ready.
          content:
            text/plain:
              schema:
                type: string
                example: "ok\n"
        "503":
          description: The service is not ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyError"
  /api/v1/meta:
    get:
      operationId: getMeta
      summary: Build and model-mode metadata
      security: []
      responses:
        "200":
          description: Current build and model mode.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Meta"
  /api/v1/openapi.yaml:
    get:
      operationId: getOpenAPIDocument
      summary: This OpenAPI document
      security: []
      responses:
        "200":
          description: OpenAPI 3.1 YAML document.
          content:
            application/yaml:
              schema:
                type: string
  /api/v1/auth/register:
    post:
      operationId: register
      summary: Create a Digital Self and a browser session
      security: []
      parameters:
        - $ref: "#/components/parameters/OriginHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: The user, Personal AI profile, and session cookies.
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/auth/login:
    post:
      operationId: login
      summary: Sign in and rotate the browser session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: The user, Personal AI profile, and session cookies.
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/auth/logout:
    post:
      operationId: logout
      summary: Revoke the current session
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "204":
          description: The session was revoked.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/auth/me:
    get:
      operationId: getMe
      summary: Current identity and Personal AI summary
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: The current user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/objects:
    get:
      operationId: listObjects
      summary: List objects visible to the caller
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Scope"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of object cards.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObjectList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/RateLimited"
    post:
      operationId: createObject
      summary: Create a Living Object
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CSRFTokenOptional"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateObjectRequest"
      responses:
        "201":
          description: The created object.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObjectView"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/objects/{id}:
    parameters:
      - $ref: "#/components/parameters/ObjectID"
    get:
      operationId: getObject
      summary: Read one object
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: The object.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObjectView"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
    delete:
      operationId: deleteObject
      summary: Soft delete an object
      parameters:
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "204":
          description: The object was soft deleted.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/objects/{id}/events:
    parameters:
      - $ref: "#/components/parameters/ObjectID"
    get:
      operationId: listObjectEvents
      summary: Read the object event timeline
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - name: cursor
          in: query
          required: false
          description: Opaque event sequence cursor.
          schema:
            type: string
      responses:
        "200":
          description: A page of visible events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/objects/{id}/actions:
    parameters:
      - $ref: "#/components/parameters/ObjectID"
    post:
      operationId: applyObjectAction
      summary: Apply one whitelisted state action
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CSRFTokenOptional"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActionRequest"
      responses:
        "200":
          description: The updated object.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObjectView"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/objects/{id}/members:
    parameters:
      - $ref: "#/components/parameters/ObjectID"
    get:
      operationId: listObjectMembers
      summary: List active object members
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Active members.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/objects/{id}/derive:
    parameters:
      - $ref: "#/components/parameters/ObjectID"
    post:
      operationId: deriveObject
      summary: Derive an independent child object
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CSRFTokenOptional"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeriveRequest"
      responses:
        "201":
          description: The independent child object.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObjectView"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/objects/{id}/lineage:
    parameters:
      - $ref: "#/components/parameters/ObjectID"
    get:
      operationId: getObjectLineage
      summary: Read bounded lineage with privacy clipping
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: depth
          in: query
          required: false
          description: Maximum depth, 1..10. Defaults to 10.
          schema:
            type: integer
            minimum: 1
            maximum: 10
      responses:
        "200":
          description: Ancestors and descendants.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lineage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/me/export:
    get:
      operationId: exportMe
      summary: Export the caller's personal data
      responses:
        '200':
          description: The caller's own data.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/objects/{id}/members/{user_id}:
    parameters:
    - $ref: '#/components/parameters/ObjectID'
    - name: user_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    delete:
      operationId: removeObjectMember
      summary: Remove an object member
      parameters:
      - $ref: '#/components/parameters/CSRFToken'
      responses:
        '204':
          description: The membership was revoked.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimited'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/objects/{id}/invitations:
    parameters:
    - $ref: '#/components/parameters/ObjectID'
    post:
      operationId: createInvitation
      summary: Create an invitation or Derive Link
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInvitationRequest'
      responses:
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimited'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '201':
          description: The invitation with its one-time plaintext token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invitation'
        '200':
          description: Idempotent replay with token:null and token_redacted:true.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invitation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
    get:
      operationId: listInvitations
      summary: List active invitations
      responses:
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimited'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '200':
          description: Active invitations without plaintext tokens.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationList'
  /api/v1/objects/{id}/invitations/{invitation_id}:
    parameters:
    - $ref: '#/components/parameters/ObjectID'
    - name: invitation_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    delete:
      operationId: revokeInvitation
      summary: Revoke an invitation immediately
      parameters:
      - $ref: '#/components/parameters/CSRFToken'
      responses:
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimited'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '204':
          description: The invitation was revoked.
  /api/v1/invitations/{token}:
    parameters:
    - name: token
      in: path
      required: true
      description: One-time invitation token.
      schema:
        type: string
    get:
      operationId: previewInvitation
      summary: Preview an invitation while signed in
      responses:
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimited'
        '404':
          $ref: '#/components/responses/NotFound'
        '200':
          description: Safe invitation metadata, never object state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationPreview'
  /api/v1/invitations/{token}/accept:
    parameters:
    - name: token
      in: path
      required: true
      schema:
        type: string
    post:
      operationId: acceptInvitation
      summary: Accept an invitation
      parameters:
      - $ref: '#/components/parameters/CSRFToken'
      responses:
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimited'
        '404':
          $ref: '#/components/responses/NotFound'
        '200':
          description: The joined object summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedInvitation'
  /api/v1/objects/{id}/handoff:
    parameters:
    - $ref: '#/components/parameters/ObjectID'
    get:
      operationId: getObjectHandoff
      summary: Build a bounded Handoff projection
      security:
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimited'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '200':
          description: The permission-trimmed object projection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Handoff'
  /api/v1/objects/{id}/proposals:
    parameters:
    - $ref: '#/components/parameters/ObjectID'
    get:
      operationId: listObjectProposals
      summary: List the caller's AI proposals
      responses:
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimited'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '200':
          description: The caller's own proposals.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProposalList'
  /api/v1/objects/{id}/proposals/{proposal_id}/apply:
    parameters:
    - $ref: '#/components/parameters/ObjectID'
    - name: proposal_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      operationId: applyObjectProposal
      summary: Apply the caller's pending AI proposal
      parameters:
      - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplyProposalRequest'
      responses:
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimited'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '200':
          description: The applied proposal and updated object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplyProposalResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
  /api/v1/objects/{id}/proposals/{proposal_id}/deny:
    parameters:
    - $ref: '#/components/parameters/ObjectID'
    - name: proposal_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      operationId: denyObjectProposal
      summary: Deny the caller's pending AI proposal
      parameters:
      - $ref: '#/components/parameters/CSRFToken'
      responses:
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimited'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '200':
          description: The denied proposal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Proposal'
  /api/v1/ai/profile:
    get:
      operationId: getPersonalAIProfile
      summary: Read the caller's Personal AI profile
      responses:
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimited'
        '200':
          description: The caller's own profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
    patch:
      operationId: updatePersonalAIProfile
      summary: Update the caller's Personal AI profile
      parameters:
      - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimited'
        '200':
          description: The updated profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
  /api/v1/ai/context:
    get:
      operationId: getPrivateAIContext
      summary: Read the caller's private AI context
      responses:
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimited'
        '200':
          description: The caller's private context.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivateContext'
    put:
      operationId: updatePrivateAIContext
      summary: Replace the caller's private AI context
      parameters:
      - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateContextRequest'
      responses:
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimited'
        '200':
          description: The updated private context.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivateContext'
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
  /api/v1/ai/conversations:
    get:
      operationId: listAIConversations
      summary: List the caller's private conversations
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimited'
        '400':
          $ref: '#/components/responses/BadRequest'
        '200':
          description: A page of private conversations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationList'
    post:
      operationId: createAIConversation
      summary: Create a private conversation
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
