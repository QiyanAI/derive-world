    parameters:
      - name: capability_id
        in: path
        required: true
        schema:
          type: string
          enum:
            - object.read
            - object.context
            - object.propose_change
            - object.derive
            - content.structure
    get:
      operationId: getCapability
      summary: Read one enabled capability descriptor
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: The capability descriptor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapabilityDescriptor"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/capabilities/{capability_id}/invoke:
    parameters:
      - name: capability_id
        in: path
        required: true
        schema:
          type: string
          enum:
            - object.read
            - object.context
            - object.propose_change
            - object.derive
            - content.structure
    post:
      operationId: invokeCapability
      summary: Invoke one capability through the Capability Broker
      description: |
        All capability calls pass through the single Broker: authentication,
        rate limits, delegation, object membership, PAT scopes, input schema,
        idempotency, execution, output schema, and audit. AI `object.derive`
        invocations return 202 while a human confirmation is pending.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CSRFTokenOptional"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CapabilityInvokeRequest"
      responses:
        "200":
          description: Synchronous success. The output has passed schema and semantic validation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapabilityInvocationSuccess"
        "202":
          description: |
            Reserved for AI-originated invocations waiting for human
            confirmation. The public session/PAT endpoint does not trigger this
            state in v0.1.0; Personal AI derive creates the confirmation through
            the conversation runtime and returns its confirmation id there.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapabilityInvocationPending"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          description: The capability failed or its result is unknown.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "504":
          description: The capability exceeded its execution deadline.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Unclassified internal failure.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
