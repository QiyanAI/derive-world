        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '429':
          $ref: '#/components/responses/RateLimited'
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: dw_session
    bearerAuth:
      type: http
      scheme: bearer
      description: Personal access token created by POST /api/v1/tokens.
  parameters:
    ObjectID:
      name: id
      in: path
      required: true
      description: UUIDv7 object identifier.
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        pattern: "^[A-Za-z0-9_-]{16,128}$"
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
    CSRFTokenOptional:
      name: X-CSRF-Token
      in: header
      required: false
      description: Required for browser cookie sessions; bearer tokens are not automatically attached by browsers and do not use it.
      schema:
        type: string
    OriginHeader:
      name: Origin
      in: header
      required: false
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque signed cursor returned by the previous page.
      schema:
        type: string
    Scope:
      name: scope
      in: query
      required: false
      schema:
        type: string
        enum: [owned, shared, all]
        default: all
  responses:
    BadRequest:
      description: The request is invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthenticated:
      description: Authentication is required.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: The action is not permitted.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: The resource does not exist or is not visible.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: A conflict, version conflict, or idempotency conflict.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PayloadTooLarge:
      description: The payload exceeds a frozen limit.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UnsupportedMediaType:
      description: Content-Type must be application/json.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RateLimited:
      description: The rate limit or budget was exceeded.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Meta:
      type: object
      additionalProperties: false
      required: [version, commit, build_time, model_mode]
      properties:
        version:
          type: string
        commit:
          type: string
        build_time:
          type: string
        model_mode:
          type: string
          enum: [fixture, real]
    ReadyError:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          const: unavailable
    CapabilityExecutionConstraints:
      type: object
      additionalProperties: false
      required: [timeout_ms, max_input_bytes, max_output_bytes]
      properties:
        timeout_ms:
          type: integer
          minimum: 1
          maximum: 10000
        max_input_bytes:
          type: integer
          minimum: 1
          maximum: 65536
        max_output_bytes:
          type: integer
          minimum: 1
          maximum: 262144
    CapabilityDescriptor:
      type: object
      additionalProperties: false
      required:
        - capability_id
        - contract_version
        - provider_id
        - description
        - input_schema
        - output_schema
        - required_scopes
        - supported_operations
        - execution_constraints
      properties:
        capability_id:
          type: string
          enum:
            - object.read
            - object.context
            - object.propose_change
            - object.derive
            - content.structure
        contract_version:
          type: string
          const: "1.0"
        provider_id:
          type: string
          enum:
            - trusted_core
            - reference.content-structure
        description:
          type: string
          minLength: 1
          maxLength: 500
        input_schema:
          type: object
        output_schema:
          type: object
        required_scopes:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum: [read, contribute, derive, invite, manage]
        supported_operations:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
        execution_constraints:
          $ref: "#/components/schemas/CapabilityExecutionConstraints"
    CapabilityList:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CapabilityDescriptor"
        next_cursor:
          type: [string, "null"]
    CapabilityObjectIDInput:
      type: object
      additionalProperties: false
      required: [object_id]
      properties:
        object_id:
          type: string
          format: uuid
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
    CapabilityProposeChangeInput:
      type: object
      additionalProperties: false
      required: [object_id, action, input, expected_version]
      properties:
        object_id:
          type: string
          format: uuid
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
        action:
          type: string
          enum:
            - set_title
            - set_summary
            - set_body
            - add_checklist_item
            - toggle_checklist_item
            - remove_checklist_item
            - add_tag
            - remove_tag
            - cast_vote
            - set_premise
            - add_element
            - update_element
            - remove_element
            - move_element
            - add_kind
            - update_kind
            - remove_kind
            - add_node
            - update_node
            - remove_node
            - move_node
            - set_node_field
            - set_node_status
            - touch_node
            - add_link
            - remove_link
            - add_rule
            - remove_rule
            - set_views
        input:
          type: object
          description: Action input. The stored proposal input is limited to 64 KiB of canonical JSON; action-level field limits from the object contract still apply.
        expected_version:
          type: integer
          minimum: 1
    CapabilityDeriveInput:
      type: object
      additionalProperties: false
      required: [object_id, inheritance_fields, title]
      properties:
        object_id:
          type: string
          format: uuid
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
        source_version:
          type: integer
          minimum: 1
        inheritance_fields:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum: [summary, body, checklist, tags, prompt, options, premise, elements, structure, views]
        title:
          type: string
          minLength: 1
          maxLength: 200
    CapabilityContentStructureInput:
      type: object
      additionalProperties: false
      required: [object_id, text, format]
      properties:
        object_id:
          type: string
          format: uuid
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
        text:
          type: string
          minLength: 1
          maxLength: 48000
        format:
          type: string
          enum: [plain_text, markdown]
    CapabilityInvokeRequest:
      description: The request body is exactly the input schema of the invoked capability.
      oneOf:
        - $ref: "#/components/schemas/CapabilityObjectIDInput"
        - $ref: "#/components/schemas/CapabilityProposeChangeInput"
        - $ref: "#/components/schemas/CapabilityDeriveInput"
        - $ref: "#/components/schemas/CapabilityContentStructureInput"
    CapabilityInvocationSuccess:
      type: object
      additionalProperties: false
      required:
        - id
        - capability_id
        - status
        - output
        - duration_ms
        - created_at
        - completed_at
      properties:
        id:
          type: string
