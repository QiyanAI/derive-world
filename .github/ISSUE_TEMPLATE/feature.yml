name: Feature request
description: Suggest a change within the OSS MVP scope
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        The first release is intentionally small. Explain the user or developer
        problem and why it belongs in the OSS MVP. Requests outside the MVP are
        recorded for future consideration.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or developer problem does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the smallest change that solves the problem.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - API
        - Web client
        - SDK
        - Personal AI
        - Capabilities
        - Documentation
        - Self-hosting
        - Other
