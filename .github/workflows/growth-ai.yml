name: Growth AI (gated)

# Model calls are OFF by default. This schedule runs only when the repository
# owner sets DGE_AI_ENABLED=1, a non-secret provider configuration and a
# call/cost budget, and stores the model key as a repository secret.
# It produces a review-only plan and never publishes.

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  issues: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  ai-plan:
    name: AI plan
    if: vars.DGE_AI_ENABLED == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
          cache: true

      - name: require owner configuration
        env:
          PROVIDER_JSON: ${{ vars.DGE_AI_PROVIDER_JSON }}
          BUDGET_JSON: ${{ vars.DGE_AI_BUDGET_JSON }}
          PROVIDER_ID: ${{ vars.DGE_AI_PROVIDER_ID }}
          MODEL_KEY: ${{ secrets.DGE_MODEL_API_KEY }}
        run: |
          set -euo pipefail
          [ -n "${PROVIDER_JSON:-}" ] || { echo "DGE_AI_PROVIDER_JSON is not set"; exit 1; }
          [ -n "${BUDGET_JSON:-}" ] || { echo "DGE_AI_BUDGET_JSON is not set"; exit 1; }
          [ -n "${PROVIDER_ID:-}" ] || { echo "DGE_AI_PROVIDER_ID is not set"; exit 1; }
          [ -n "${MODEL_KEY:-}" ] || { echo "DGE_MODEL_API_KEY secret is not set"; exit 1; }

      - name: locate the latest successful metrics run
        id: metrics
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow metrics-daily.yml \
            --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -z "$run_id" ]; then
            echo "::error::no successful metrics-daily run; refusing to generate an AI plan"
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: download the metrics artifact
        if: steps.metrics.outputs.run_id != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          bash ops/growth-engine/scripts/fetch-metrics-artifact.sh \
            "${{ steps.metrics.outputs.run_id }}" ops/growth-engine/.artifacts/metrics 3

      - name: record data provenance
        working-directory: ops/growth-engine
        run: |
          set -euo pipefail
          mkdir -p runs
          cp .artifacts/metrics/provenance.json runs/data-provenance.json
          {
            echo "## Data provenance"
            echo '```json'
            cat runs/data-provenance.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: export item-level public issue and pull-request metadata
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          INTERNAL_AUTHORS: ${{ vars.DGE_INTERNAL_AUTHORS || 'QiyanNarantsogt' }}
        run: bash ops/growth-engine/scripts/engagement-export.sh /tmp/engagement.json

      - name: prepare shared usage state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh auth setup-git
          if ! git ls-remote --exit-code --heads "https://github.com/$GITHUB_REPOSITORY.git" dge-state >/dev/null 2>&1; then
            echo "::error::the dge-state branch does not exist; run ops/growth-engine/scripts/init-state-branch.sh once as the owner"
            exit 1
          fi
          git clone --depth 1 --branch dge-state "https://github.com/$GITHUB_REPOSITORY.git" ops/growth-engine/.state
          git -C ops/growth-engine/.state config user.name "growth-engine[bot]"
          git -C ops/growth-engine/.state config user.email "growth-engine@users.noreply.github.com"

      - name: write owner configuration
        env:
          PROVIDER_JSON: ${{ vars.DGE_AI_PROVIDER_JSON }}
          BUDGET_JSON: ${{ vars.DGE_AI_BUDGET_JSON }}
        run: |
          set -euo pipefail
          printf '%s' "$PROVIDER_JSON" > ops/growth-engine/state/providers.generated.json
          printf '%s' "$BUDGET_JSON" > /tmp/dge-budget.json
          python3 -c "import json;json.load(open('ops/growth-engine/state/providers.generated.json'));json.load(open('/tmp/dge-budget.json'))"

      - name: AI-assisted plan
        working-directory: ops/growth-engine
        env:
          DGE_STOP: ${{ vars.DGE_STOP }}
          DGE_MODEL_API_KEY: ${{ secrets.DGE_MODEL_API_KEY }}
          PROVIDER_ID: ${{ vars.DGE_AI_PROVIDER_ID }}
        run: |
          set -euo pipefail
          snapshot=".artifacts/metrics/snapshot.json"
          test -f "$snapshot" || {
            echo "::error::latest metrics snapshot unavailable; refusing to use a historical baseline"
            exit 1
          }
          args=(pipeline --snapshot "$snapshot" --out-dir runs --min-interval 2s
            --providers state/providers.generated.json --provider "$PROVIDER_ID"
            --budget /tmp/dge-budget.json --usage usage.json
            --usage-git-dir .state --usage-git-branch dge-state)
          if [ -f /tmp/engagement.json ]; then
            args+=(--engagement /tmp/engagement.json)
          fi
          go run . "${args[@]}"

      - name: summarize
        if: always()
        working-directory: ops/growth-engine
        run: |
          set -euo pipefail
          report=$(ls -1 runs/*-pipeline.md 2>/dev/null | sort | tail -1 || true)
          if [ -z "$report" ]; then
            echo "No AI plan was produced." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          cat "$report" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: growth-ai-plan
          path: ops/growth-engine/runs/
          if-no-files-found: warn
          retention-days: 30
