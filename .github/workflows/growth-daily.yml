name: Growth Daily

# Deterministic daily opportunity scan. It reuses the metrics artifact and
# never calls a model or publishes anything.

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  plan:
    name: Daily plan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
          cache: true

      - name: locate the latest successful metrics run
        id: metrics
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow metrics-daily.yml \
            --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -z "$run_id" ]; then
            echo "::error::no successful metrics-daily run; refusing to generate a growth report"
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: download the metrics artifact
        if: steps.metrics.outputs.run_id != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          bash ops/growth-engine/scripts/fetch-metrics-artifact.sh \
            "${{ steps.metrics.outputs.run_id }}" ops/growth-engine/.artifacts/metrics 3

      - name: record data provenance
        working-directory: ops/growth-engine
        run: |
          set -euo pipefail
          mkdir -p runs
          cp .artifacts/metrics/provenance.json runs/data-provenance.json
          {
            echo "## Data provenance"
            echo '```json'
            cat runs/data-provenance.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: export item-level public issue and pull-request metadata
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          INTERNAL_AUTHORS: ${{ vars.DGE_INTERNAL_AUTHORS || 'QiyanNarantsogt' }}
        run: bash ops/growth-engine/scripts/engagement-export.sh /tmp/engagement.json

      - name: deterministic pipeline plan
        working-directory: ops/growth-engine
        env:
          DGE_STOP: ${{ vars.DGE_STOP }}
        run: |
          set -euo pipefail
          snapshot=".artifacts/metrics/snapshot.json"
          test -f "$snapshot" || {
            echo "::error::latest metrics snapshot unavailable; refusing to use a historical baseline"
            exit 1
          }
          args=(pipeline --snapshot "$snapshot" --out-dir runs --min-interval 2s)
          if [ -f /tmp/engagement.json ]; then
            args+=(--engagement /tmp/engagement.json)
          fi
          go run . "${args[@]}"

      - name: summarize
        if: always()
        working-directory: ops/growth-engine
        run: |
          set -euo pipefail
          report=$(ls -1 runs/*-pipeline.md 2>/dev/null | sort | tail -1 || true)
          if [ -z "$report" ]; then
            echo "No pipeline report was produced." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          cat "$report" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: growth-daily
          path: ops/growth-engine/runs/
          if-no-files-found: warn
          retention-days: 30
