version: 2
updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      go-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: gomod
    directory: "/examples/capability-provider"
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
  - package-ecosystem: gomod
    directory: "/ops/github-metrics"
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      react:
        patterns: ["react", "react-dom", "react-router", "@types/react", "@types/react-dom"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    groups:
      base-images:
        patterns: ["*"]
